# Nginx site for the invitation.
# Copy to /etc/nginx/sites-available/jithin-dona-bigday-invitation and enable it (see DEPLOY-HOSTINGER.md).
# Certbot adds the HTTPS (port 443) part to this file automatically.

server {
    listen 80;
    listen [::]:80;
    server_name jithin-dona-bigday-invitation.upgrow.com;

    client_max_body_size 16k;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }
}
